#Azure Connection
spring.cloud.azure.credential.client-id=${AZURE_CLIENT_ID}
spring.cloud.azure.credential.client-secret=${AZURE_SECRET_ID}
spring.cloud.azure.profile.tenant-id=${AZURE_TENANT_ID}
spring.cloud.azure.keyvault.secret.property-sources[0].endpoint=${KEY_VAULT_ENDPOINT}

# Tokens expiration time
greencity.authorization.token-key=${JWT_SECRET_KEY}

# Datasource
spring.datasource.url=${UBS_DATASOURCE_URL}
spring.datasource.username=${DATASOURCE_USERNAME}
spring.datasource.password=${DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE}
server.port=8050

# Liquibase
spring.liquibase.url=${UBS_DATASOURCE_URL}
spring.liquibase.user=${DATASOURCE_USERNAME}
spring.liquibase.password=${DATASOURCE_PASSWORD}
spring.liquibase.enabled=${LIQUIBASE_ENABLED}
spring.liquibase.change-log=${LIQUIBASE_CHANGE_LOG}

# Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_HIBERNATE_DDL_AUTO}
spring.jpa.show-sql=${JPA_SHOW_SQL}
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.cache.use_second_level_cache=true
spring.jpa.properties.hibernate.cache.use_query_cache=true
spring.jpa.properties.hibernate.cache.region.factory_class=org.hibernate.cache.jcache.internal.JCacheRegionFactory
spring.jpa.properties.hibernate.javax.cache.uri=classpath:ehcache.xml
spring.jpa.properties.hibernate.javax.cache.provider=org.ehcache.jsr107.EhcacheCachingProvider
spring.jpa.properties.hibernate.default_batch_fetch_size=10

#RestTemplate
greencity.redirect.user-server-address=${GREENCITYUSER_SERVER_ADDRESS}

#WebClient
webclient.connection-timeout-millis=${WEBCLIENT_CONNECTION_TIMEOUT}
webclient.response-timeout-millis=${WEBCLIENT_RESPONSE_TIMEOUT}

#TelegraBot
greencity.bots.ubs-bot-name=${TELEGRAM_BOT_NAME}
greencity.bots.ubs-bot-token=${TELEGRAM_BOT_TOKEN}
greencity.bots.ubs-bot-ui=${GREENCITY_UBS_ADMIN_BASE_URL}

#WayForPay
greencity.wayforpay.login=${WAY_FOR_PAY_LOGIN}
greencity.wayforpay.secret=${WAY_FOR_PAY_SECRET}
greencity.wayforpay.merchant.domain.name=${WAY_FOR_PAY_MERCHANT_DOMAIN_NAME}

#Payment redirection
greencity.redirect.result-way-for-pay-url=${WAY_FOR_PAY_REDIRECT}
#WayForPay handler redirect
greencity.redirect.green-city-client=${WAY_FOR_PAY_RETURN_URL}
#GreenCityConfirmPage
redirect.confirm-page=${WAY_FOR_PAY_CONFIRM_PAGE}

#Unpaid order link
greencity.internal.order-url=https://www.greencity.cx.ua/#/ubs/order/

#OrderLockDuration
order.lock.duration.minutes=${ORDER_LOCK_DURATION_MINUTES}

#Cache
greencity.cache.lifetime=10
greencity.cache.countQueryCacheLifetime=10
greencity.cache.countQueryCacheMaximumEntries=100

# QuartzProperties
spring.quartz.job-store-type=jdbc
spring.quartz.jdbc.initialize-schema=never
spring.quartz.jdbc.schema=classpath:db/changelog/logs/ch-add-quartz-tables.xml
spring.quartz.properties.org.quartz.jobStore.driverDelegateClass=org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
spring.quartz.properties.org.quartz.scheduler.instanceId=AUTO
spring.quartz.properties.org.quartz.scheduler.instanceName=MyClusteredScheduler

# File upload limit
spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE}
spring.servlet.multipart.max-request-size=${MULTIPART-MAX-REQUEST-SIZE}
server.tomcat.max-http-form-post-size=${TOMCAT_MAX_HTTP_FORM_POST_SIZE}

greencity.schedule-constants.certificates-scheduler.cron = 0 0 0 * * *
greencity.schedule-constants.zone = Europe/Kiev

# Feign FallbackFactories
feign.hystrix.enabled=true
hystrix.command.default.execution.isolation.strategy=SEMAPHORE
hystrix.shareSecurityContext=true

# change default hystrix timeout to 10 seconds
hystrix.command.default.execution.isolation.thread.timeoutInMilliseconds=20000
ribbon.ConnectTimeout=20000
ribbon.ReadTimeout=20000


greencity.authorization.googleApiKey=${GOOGLE_API_KEY}

# Swagger configuration
springdoc.paths-to-match=/**
springdoc.paths-to-exclude=/management/**
springdoc.packages-to-scan=greencity.controller,com.softserve.ldm.controller
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.defaultModelRendering=example

# Email for service-to-service communication with GreenCityUser
greencity.authorization.service-email=${SYSTEM_EMAIL_ADDRESS}

#WebSockets
spring.messaging.stomp.websocket.allowed-origins=\
  https://greencity-ubs.greencity.cx.ua, \
  https://greencity-ubs.greencity.cx.ua/, \
  https://greencity-ubs.greencity.cx.ua/*, \
  https://www.greencity.cx.ua, \
  https://www.greencity.cx.ua/, \
  https://www.greencity.cx.ua/*, \
  https://greencity.greencity.cx.ua, \
  https://greencity.greencity.cx.ua/, \
  https://greencity.greencity.cx.ua/*, \
  http://secure-redirect.cloudipsp.com/, \
  http://localhost:4200, \
  http://localhost:4200/*, \
  http://localhost:4205, \
  http://localhost:4205/*, \
  http://localhost:63342/*, \
  http://localhost:63342, \
  http://localhost:8050/*, \
  https://api.wayforpay.com/*, \
  https://secure.wayforpay.com/*


greencity.sing-in.secret-token=${TESTERS_SIGN_IN_TOKEN}

springwolf.enabled=true
springwolf.use-fqn=true
springwolf.docket.base-package=greencity.producers
springwolf.docket.info.title=GreenCity UBS
springwolf.docket.info.version=1.0.0
springwolf.docket.info.description=Green City UBS
springwolf.docket.info.license.name=Apache License 2.0
springwolf.docket.servers.stomp.protocol=stomp
springwolf.docket.servers.stomp.host=https://greencity-ubs.greencity.cx.ua/socket