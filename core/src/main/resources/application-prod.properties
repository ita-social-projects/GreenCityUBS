# Logger
logging.level.root=${LOG_LEVEL_ROOT:info}
logging.level.greencity.exception.handler.CustomExceptionHandler=${LOG_EXCEPTION_HANDLER:TRACE}
logging.file.path=logs
logging.file.name=${LOG_FILE:logs}
logging.pattern.file=${LOG_PATTERN:[%d{${DATE_FORMAT}}] %highlight(%-5level) %cyan(%-40.40logger{40}) %magenta(%-5.5(:%line)) %msg%n}