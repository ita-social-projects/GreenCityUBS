# Tokens expiration time
greencity.authorization.token-key=${TOKEN_KEY}

# Datasource
spring.datasource.url=${JAWSDB_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=${DRIVER}
spring.datasource.hikari.maximumPoolSize=${POOL_SIZE}
server.port=8060

# Liquibase
spring.liquibase.url=${JAWSDB_URL}
spring.liquibase.user=${DATABASE_USER}
spring.liquibase.password=${DATABASE_PASSWORD}
spring.liquibase.enabled=${LIQUIBASE_ENABLE}
spring.liquibase.change-log=${LIQUIBASE_LOG}

# Hibernate
spring.jpa.hibernate.ddl-auto=${HIBERNATE_CONFIG}
#spring.jpa.show-sql=${SHOW_SQL}
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=${JDBC_LOB}
spring.jpa.properties.hibernate.cache.use_second_level_cache=${HIBERNATE_L2C_ENABLED:true}
spring.jpa.properties.hibernate.cache.use_query_cache=${HIBERNATE_L2C_ENABLED:true}
spring.jpa.properties.hibernate.cache.region.factory_class=org.hibernate.cache.jcache.internal.JCacheRegionFactory
spring.jpa.properties.hibernate.javax.cache.uri=classpath:ehcache.xml
spring.jpa.properties.hibernate.javax.cache.provider=org.ehcache.jsr107.EhcacheCachingProvider

#RestTemplate
greencity.redirect.user-server-address=https://greencity-user.greencity.cx.ua/

#WebClient
webclient.connection-timeout-millis=5000
webclient.response-timeout-millis=5000

#TelegraBot
greencity.bots.ubs-bot-name=${TELEGRAM_BOT_NAME}
greencity.bots.ubs-bot-token=${TELEGRAM_BOT_TOKEN}

#WayForPay
greencity.wayforpay.login=${WAY_FOR_PAY_LOGIN}
greencity.wayforpay.secret=${WAY_FOR_PAY_SECRET}
greencity.wayforpay.merchant.domain.name=${DOMAIN_NAME}

#Payment redirection
greencity.redirect.result-way-for-pay-url=${WAY_FOR_PAY_REDIRECT}
#WayForPay handler redirect
greencity.redirect.green-city-client=${WAY_FOR_PAY_RETURN_URL}
#GreenCityConfirmPage
redirect.confirm-page=${WAY_FOR_PAY_CONFIRM_PAGE}

#Unpaid order link
greencity.internal.order-url=https://www.greencity.cx.ua/#/ubs/order/

#OrderLockDuration
order.lock.duration.minutes=5

#Link in telegram notification
greencity.ubs.admin.base-url=${GREENCITY_UBS_ADMIN_BASE_URL:https://www.pick-up.city/#/ubs/admin/}

#Cache
greencity.cache.lifetime=${CACHE_LIFE_TIME:10}

# Logger
logging.level.root=${LOG_LEVEL_ROOT:info}
logging.level.greencity.exception.handler.CustomExceptionHandler=${LOG_EXCEPTION_HANDLER:TRACE}
logging.file.path=logs
logging.file.name=${LOG_FILE:logs}
logging.pattern.file=${LOG_PATTERN:[%d{${DATE_FORMAT}}] %highlight(%-5level) %cyan(%-40.40logger{40}) %magenta(%-5.5(:%line)) %msg%n}

# QuartzProperties
spring.quartz.job-store-type=jdbc
spring.quartz.jdbc.initialize-schema=never
spring.quartz.jdbc.schema=classpath:db/changelog/logs/ch-add-quartz-tables.xml
spring.quartz.properties.org.quartz.jobStore.driverDelegateClass=org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
spring.quartz.properties.org.quartz.scheduler.instanceId=AUTO
spring.quartz.properties.org.quartz.scheduler.instanceName=MyClusteredScheduler