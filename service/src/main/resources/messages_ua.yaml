feedback.message: |
  Ми хочемо ставати кращою версією себе 🤗

  Тому нам дуже потрібні ваші чесні відгуки про нашу роботу ☝️

  Нам важливо знати вашу думку! Поділіться, будь ласка, своїм враженням
  про нашу роботу.

great.feedback.message: |
  Дуже рада це чути! ❤️

  Ваші відгуки допомагають нам розвиватися! Будемо й надалі вдосконалювати
  нашу роботу 💪
  Залиште, будь ласка, кілька слів, що саме вам вподобалося в нашому сервісі 👇

bad.feedback.message: |
