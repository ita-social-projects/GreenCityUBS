sorting.rules.pricing.message: |
  У 120-ти літровий пакет потрібно скласти змішану вторсировину й неліквіди
  (окрім небезпечних, забруднених, будівельних відходів, а також відходів,
  які контактували з рідинами тіла — перелік тут —
  <a href="https://nowaste.com.ua/sort-station">Посилання</a>).

  Текстильні відходи (зношений одяг, взуття, сумки, м’які іграшки, ковдри)
  потрібно складати в окремі пакети.

  Максимальна вага пакету на 120 л для міксу паковання — до 5 кг
  Максимальна вага пакету на 120 л для текстилю — до 10 кг.

  <b>Вартість послуги</b>👇
  Мікс сировини:
  120 грн/35 л
  180 грн/60 л
  270 грн/120 л
  350 грн/160 л
  520 грн/240 л

  Текстильні відходи:
  130 грн/20 л
  295 грн/60 л

