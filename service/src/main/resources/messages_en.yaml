work.schedule.message: |
  <b>No Waste Recycling Station</b>
  Kyiv, 25/4 Saperno-Slobidska St. (Ukraine Without Waste)

  <b>Station working hours</b>
  Tue–Fri — 13:00–18:00
  Sat–Sun — 10:00–15:30

  <b>Paid service “UBS Uklon”</b>
  Mon–Fri: 9:00–18:00
  Sat–Sun: 10:00–15:30

  <b>Paid service “Resorting”</b>
  Available 24/7

sorting.rules.pricing.message: |
  Mixed recyclables and non-liquid waste (excluding hazardous,
  contaminated, construction waste, and waste that contacted bodily fluids —
  list here: <a href="https://nowaste.com.ua/sort-station">Link</a>)
  should be packed in a 120-liter bag.

  Textile waste (worn clothes, shoes, bags, soft toys, blankets)
  must be packed separately.

  Max weight for mixed packaging in a 120L bag: 5 kg
  Max weight for textiles in a 120L bag: 10 kg.

  <b>Service pricing</b>👇
  Mixed recyclables:

  120 UAH/35 L
  180 UAH/60 L
  270 UAH/120 L
  350 UAH/160 L
  520 UAH/240 L

  Textile waste:

  130 UAH/20 L
  295 UAH/60 L

admission.rules.text: |
  Everything we accept at the station for recycling or safe incineration
  (full list here: <a href="https://nowaste.com.ua/sort-station">Link</a>)

