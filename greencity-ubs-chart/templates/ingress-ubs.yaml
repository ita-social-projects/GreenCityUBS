apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-greencity-ubs-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: 150m
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "http://localhost:4200, https://www.greencity.cx.ua"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      if ($request_uri ~* "^/actuator") {
        return 403;
      }
spec:
  tls:
  - hosts:
    - {{ .Values.ingress.hostname }}
    secretName: {{ .Release.Name }}-greencity-ubs
  rules:
  - host: {{ .Values.ingress.hostname }}
    http:
      paths:
      # fake service to block /actuator/prometheus and allow all other endpoint
      - path: /actuator/prometheus
        pathType: Exact
        backend:
          service:
            name: actuator-prometheus-blocker
            port:
              number: 80

      - path: /
        pathType: Prefix
        backend:
          service: 
            name: {{ .Release.Name }}-greencity-ubs-service
            port: 
              number: 80
