# This is a basic workflow to help you get started with Actions

name: CI/CD GreenCityUBS
# Controls when the action will run.

concurrency: Testing

on:
  # Triggers the workflow on push or pull request events but only for the dev branch
  push:
    branches: [ dev, prod ]
  pull_request:
    branches: [ dev, prod ]
  workflow_dispatch:

env:
  repository: ubs
  userRepoName: core
  onbootJarName: app.jar
  dockerRepoName: skyere/greencityubs

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    runs-on: ubuntu-latest
    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - uses: actions/checkout@v2

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: 21
          distribution: 'temurin'

#       - name: Set up Go
#         uses: actions/setup-go@v3
#         with:
#           go-version: 1.18

      - name: Run a multi-line script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          git fetch --unshallow
          mvn clean install org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=ita-social-projects-green-ubs \
            -Dsonar.organization=ita-social-projects \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.binaries=target/classes \
            -Dsonar.dynamicAnalysis=reuseReports \
            -Dsonar.exclusions=**/EncryptionUtil.java \
            -Dsonar.coverage.exclusions='**/configuration/*,**/entity/*,**/exceptions/*,**/exceptions/**,**/enums/*,**/enums/**,**/BigOrderTableRepository.java,**/ChatLinkDto.java,**/entity/telegram/AuthorizedUser.java,**/dto/telegram/AuthorizedUserDto.java,**/service/ubs/BASE64DecodedMultipartFile.java,**/entity/telegram/ChatFeedback.java,**/dto/telegram/FeedbackDto.java,**/entity/telegram/Image.java,**/mapping/telegrammessage/ImageConverter.java,**/ubstelegrambot/keyboards/KeyboardFactory.java,**/ubstelegrambot/messages/MessageFactory.java,**/dto/SuccessSignInDto.java,**/config/TelegramBotConfig.java,**/dto/telegram/TelegramImageDto.java,**/entity/telegram/TelegramMessage.java,**/dto/telegram/TelegramTextMessageDto.java,**/entity/telegram/TelegramUser.java,**/dto/TestersSignInRequest.java,**/entity/telegram/TextMessage.java,**/mapping/telegrammessage/TextMessageMapper.java,**/entity/telegram/UnknownTelegramUser.java,**/dto/telegram/UnknownTelegramUserDto.java,**/specification/*,**/entity/telegram/TelegramChat.java,**/constant/**,**/constant/*'
      
      - name: Test Reporter
        #v1.5.0
        uses: dorny/test-reporter@0d00bb14cb0cc2c9b8985df6e81dd333188224e1
        if: success() || failure()
        with:
          name: Tests Report
          path: '**/target/surefire-reports/*.xml'
          reporter: java-junit
      
      - name: Rename user jar to app
        run: mv $userRepoName/target/*.jar $userRepoName/target/$onbootJarName

      - name: Set outputs
        run: echo "GITHUB_SHA_SHORT=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Docker Login
        #v2.0.0
        uses: docker/login-action@49ed152c8eca782a232dede0303416e8f356c37b
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Build and push Docker images
        #v3.0.0
        uses: docker/build-push-action@e551b19e49efd4e98792db7592c17c09b89db8d8
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ env.dockerRepoName }}:test-${{ env.GITHUB_SHA_SHORT }}

#       - name: Kubernetes Set Context
#         uses: Azure/k8s-set-context@v3.0
#         with:
#           kubeconfig: ${{ secrets.KUBE_CONFIG }}
      
#       - name: Set up Postgres
#         run: kubectl scale deploy postgres --replicas=1 -n test
      
#       - name: Kubernetes tests
#         run: |
#           cd chart-test
#           go test -v ./...
      
#       - name: Post Set up Postgres
#         if: success() || failure()
#         run: kubectl scale deploy postgres --replicas=0 -n test

        # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Deploy 🚀
        if: ${{ github.event_name == 'push' }}
        #v3.7.1
        uses: JamesIves/github-pages-deploy-action@132898c54c57c7cc6b80eb3a89968de8fc283505
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: gh-pages
          FOLDER: .
          CLEAN: true
